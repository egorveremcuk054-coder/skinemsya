name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Интеграционные тесты поднимают PostgreSQL через Testcontainers:
      # Docker на раннерах GitHub уже есть.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t skinemsya .
